<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventilador Interactivo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="card">
      <h1>Ventilador Interactivo</h1>

      <div class="fan-scene" id="fanScene">
        <div class="fan-head">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#eaf3ff"/>
                <stop offset="45%" stop-color="#bcd6f5"/>
                <stop offset="100%" stop-color="#7fa7d9"/>
              </linearGradient>

              <radialGradient id="hubGrad" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="35%" stop-color="#d7dde5"/>
                <stop offset="70%" stop-color="#9aa4b2"/>
                <stop offset="100%" stop-color="#5b6472"/>
              </radialGradient>

              <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#f1f4f8"/>
                <stop offset="30%" stop-color="#c7cfd9"/>
                <stop offset="70%" stop-color="#8b95a3"/>
                <stop offset="100%" stop-color="#5b6472"/>
              </linearGradient>

              <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
              </filter>
            </defs>

            <!-- Marco exterior -->
            <circle cx="100" cy="100" r="92" fill="none" stroke="url(#frameGrad)" stroke-width="13"/>
            <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"
                    stroke-dasharray="70 400" stroke-linecap="round" transform="rotate(-125 100 100)"/>
            <circle cx="100" cy="100" r="86" fill="#0d1119" opacity="0.35"/>

            <!-- ASPAS (grupo rotable) -->
            <g id="bladesGroup" filter="url(#softShadow)">
              <g fill="url(#bladeGrad)">
                <path d="M100,102 C91,92 84,68 87,46 C89,30 96,17 104,11
                         C110,8 114,13 112,20 C109,36 106,57 103,78
                         C102,87 101,95 100,102 Z"
                      transform="rotate(0 100 100)"/>
                <path d="M100,102 C91,92 84,68 87,46 C89,30 96,17 104,11
                         C110,8 114,13 112,20 C109,36 106,57 103,78
                         C102,87 101,95 100,102 Z"
                      transform="rotate(120 100 100)"/>
                <path d="M100,102 C91,92 84,68 87,46 C89,30 96,17 104,11
                         C110,8 114,13 112,20 C109,36 106,57 103,78
                         C102,87 101,95 100,102 Z"
                      transform="rotate(240 100 100)"/>
              </g>
            </g>

            <!-- REJILLA radial -->
            <g id="grille" stroke="rgba(220,226,235,0.55)" stroke-width="0.9" fill="none" opacity="0.75"></g>

            <!-- Círculos concéntricos -->
            <circle cx="100" cy="100" r="24" fill="none" stroke="rgba(220,226,235,0.55)" stroke-width="0.9"/>
            <circle cx="100" cy="100" r="45" fill="none" stroke="rgba(220,226,235,0.5)" stroke-width="0.9"/>
            <circle cx="100" cy="100" r="65" fill="none" stroke="rgba(220,226,235,0.45)" stroke-width="0.9"/>
            <circle cx="100" cy="100" r="83" fill="none" stroke="rgba(220,226,235,0.4)" stroke-width="0.9"/>

            <!-- Eje central -->
            <circle cx="100" cy="100" r="15" fill="url(#hubGrad)" filter="url(#softShadow)"/>
            <circle cx="96" cy="96" r="4.2" fill="rgba(255,255,255,0.85)"/>
            <circle cx="100" cy="100" r="15" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
          </svg>

          <!-- Viento y partículas -->
          <svg class="wind" viewBox="0 0 100 160" preserveAspectRatio="none">
            <path class="wind-line" d="M2,40 Q40,30 70,42"/>
            <path class="wind-line" d="M0,78 Q42,68 75,80"/>
            <path class="wind-line" d="M4,118 Q40,108 68,120"/>
          </svg>
          <span class="particle"></span>
          <span class="particle"></span>
          <span class="particle"></span>
        </div>

        <div class="neck"></div>
        <div class="base"></div>
      </div>

      <div class="controls-panel">
        <p class="status">Estado: <span id="statusText">Apagado</span></p>

        <div class="power-row">
          <button class="pill-btn on" id="btnOn">ON</button>
          <button class="pill-btn off active" id="btnOff">OFF</button>
        </div>

        <div class="speed-row">
          <button class="speed-btn" data-speed="1" disabled>1</button>
          <button class="speed-btn" data-speed="2" disabled>2</button>
          <button class="speed-btn" data-speed="3" disabled>3</button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
